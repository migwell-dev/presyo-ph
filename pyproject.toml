[project]
name = "presyo-ph"
version = "0.1.0"
description = "Philippine Food Price Analytics & Forecasting"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.optional-dependencies]
local = [
    "pyspark==4.1.0",
    "delta-spark==4.1.0",
]

[project.scripts]
presyo-ph = "presyo_ph:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "presyo_ph"
module-root = "src"

[tool.databricks.environment]
environment_version = "5"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
