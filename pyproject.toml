[project]
name = "presyo-ph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "migwell-dev", email = "miggyfortuna0413@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.1.0",
    "requests>=2.34.2",
]

[project.scripts]
presyo-ph = "presyo_ph:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
